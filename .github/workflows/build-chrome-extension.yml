name: Build Chrome Extension

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to attach the Chrome extension zip to a GitHub Release, for example v1.0.0"
        required: false
        type: string
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "public/**"
      - "*.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "uno.config.ts"
      - ".github/workflows/build-chrome-extension.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "*.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "uno.config.ts"
      - ".github/workflows/build-chrome-extension.yml"

jobs:
  build:
    name: Build Chrome extension zip
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify extension manifest
        run: test -f dist/manifest.json

      - name: Package Chrome Web Store zip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          dist = Path('dist')
          output = Path('artifacts/devx-chrome-extension.zip')
          output.parent.mkdir(parents=True, exist_ok=True)

          with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
            for path in dist.rglob('*'):
              if path.is_file():
                archive.write(path, path.relative_to(dist))
          PY

      - name: Upload Chrome extension zip
        uses: actions/upload-artifact@v4
        with:
          name: devx-chrome-extension
          path: artifacts/devx-chrome-extension.zip
          if-no-files-found: error

  publish-release:
    name: Attach Chrome extension zip to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    permissions:
      contents: write

    steps:
      - name: Download Chrome extension zip
        uses: actions/download-artifact@v4
        with:
          name: devx-chrome-extension
          path: release-assets

      - name: Upload Chrome extension zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release-assets/devx-chrome-extension.zip
          fail_on_unmatched_files: true
