name: Build DEVX Server

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to publish a GitHub Release, for example v1.0.0"
        required: false
        type: string
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "server/**"
      - ".github/workflows/build-devx-server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/build-devx-server.yml"

jobs:
  build:
    name: ${{ matrix.target.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-amd64
            runs_on: ubuntu-24.04
            goos: linux
            goarch: amd64
            cli_name: devx-cli-linux-amd64
            ui_name: devx-ui-linux-amd64
          - name: linux-arm64
            runs_on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cli_name: devx-cli-linux-arm64
            ui_name: devx-ui-linux-arm64
          - name: windows-amd64
            runs_on: windows-2025
            goos: windows
            goarch: amd64
            msystem: UCRT64
            toolchain: mingw-w64-ucrt-x86_64-gcc
            compiler_path: ucrt64\bin\gcc.exe
            cxx_path: ucrt64\bin\g++.exe
            cli_name: devx-cli-windows-amd64.exe
            ui_name: devx-ui-windows-amd64.exe
          - name: windows-arm64
            runs_on: windows-11-arm
            goos: windows
            goarch: arm64
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-clang
            compiler_path: clangarm64\bin\clang.exe
            cxx_path: clangarm64\bin\clang++.exe
            cli_name: devx-cli-windows-arm64.exe
            ui_name: devx-ui-windows-arm64.exe
          - name: macos-amd64
            runs_on: macos-15-intel
            goos: darwin
            goarch: amd64
            cli_name: devx-cli-darwin-amd64
            ui_name: devx-ui-darwin-amd64
            dmg_name: devx-ui-darwin-amd64.dmg
          - name: macos-arm64
            runs_on: macos-15
            goos: darwin
            goarch: arm64
            cli_name: devx-cli-darwin-arm64
            ui_name: devx-ui-darwin-arm64
            dmg_name: devx-ui-darwin-arm64.dmg

    runs-on: ${{ matrix.target.runs_on }}

    env:
      CGO_ENABLED: "1"
      GOOS: ${{ matrix.target.goos }}
      GOARCH: ${{ matrix.target.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev

      - name: Setup Windows toolchain
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.target.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.target.toolchain }}

      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.target.compiler_path }}'
          $cxx = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.target.cxx_path }}'

          if (-not (Test-Path $compiler)) {
            throw "C compiler not found: $compiler"
          }
          if (-not (Test-Path $cxx)) {
            throw "C++ compiler not found: $cxx"
          }

          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$cxx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Go modules
        working-directory: server
        run: go mod download

      - name: Prepare dist
        run: mkdir -p server/dist

      - name: Configure macOS signing mode
        id: macos_signing_config
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(
            MACOS_CERTIFICATE_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_CODESIGN_IDENTITY
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )

          configured=0
          missing=()
          for name in "${required[@]}"; do
            if [ -n "${!name}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
            echo "macOS signing/notarization secrets are not configured; building unsigned DMG."
            exit 0
          fi

          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing macOS signing/notarization secrets:\n'
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

          echo "signing_enabled=true" >> "$GITHUB_OUTPUT"

      - name: Install Apple signing certificate
        if: runner.os == 'macOS' && steps.macos_signing_config.outputs.signing_enabled == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          certificate_path="$RUNNER_TEMP/devx-certificate.p12"
          keychain_path="$RUNNER_TEMP/devx-signing.keychain-db"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['RUNNER_TEMP'], 'devx-certificate.p12').write_bytes(
              base64.b64decode(os.environ['MACOS_CERTIFICATE_BASE64'])
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Build CLI
        working-directory: server
        run: go build -trimpath -o "dist/${{ matrix.target.cli_name }}" ./cmd/devx-cli

      - name: Build Tray UI
        working-directory: server
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -trimpath -ldflags="-H=windowsgui" -o "dist/${{ matrix.target.ui_name }}" ./cmd/devx-ui
          else
            go build -trimpath -o "dist/${{ matrix.target.ui_name }}" ./cmd/devx-ui
          fi
        shell: bash

      - name: Create macOS Tray UI app bundle
        if: runner.os == 'macOS'
        working-directory: server
        shell: bash
        run: |
          app_dir="build/macos/DevX.app"
          rm -rf "build/macos" "dist/${{ matrix.target.dmg_name }}"
          mkdir -p "$app_dir/Contents/MacOS" "$app_dir/Contents/Resources"

          cp "dist/${{ matrix.target.ui_name }}" "$app_dir/Contents/MacOS/devx-ui"
          chmod +x "$app_dir/Contents/MacOS/devx-ui"

          cat > "$app_dir/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>devx-ui</string>
            <key>CFBundleIdentifier</key>
            <string>dev.athxx.devx.ui</string>
            <key>CFBundleName</key>
            <string>DevX</string>
            <key>CFBundleDisplayName</key>
            <string>DevX</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Sign macOS Tray UI app bundle
        if: runner.os == 'macOS' && steps.macos_signing_config.outputs.signing_enabled == 'true'
        working-directory: server
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          app_dir="build/macos/DevX.app"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            "$app_dir/Contents/MacOS/devx-ui"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            "$app_dir"
          codesign --verify --deep --strict --verbose=2 "$app_dir"

      - name: Package macOS Tray UI DMG
        if: runner.os == 'macOS'
        working-directory: server
        shell: bash
        run: |
          hdiutil create \
            -volname "DevX" \
            -srcfolder "build/macos/DevX.app" \
            -ov \
            -format UDZO \
            "dist/${{ matrix.target.dmg_name }}"

      - name: Sign macOS Tray UI DMG
        if: runner.os == 'macOS' && steps.macos_signing_config.outputs.signing_enabled == 'true'
        working-directory: server
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          codesign \
            --force \
            --timestamp \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            "dist/${{ matrix.target.dmg_name }}"
          codesign --verify --verbose=2 "dist/${{ matrix.target.dmg_name }}"

      - name: Notarize and staple macOS Tray UI DMG
        if: runner.os == 'macOS' && steps.macos_signing_config.outputs.signing_enabled == 'true'
        working-directory: server
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "dist/${{ matrix.target.dmg_name }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/${{ matrix.target.dmg_name }}"
          xcrun stapler validate "dist/${{ matrix.target.dmg_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: |
            server/dist/${{ matrix.target.cli_name }}
            server/dist/${{ matrix.target.ui_name }}
            server/dist/*.dmg
          if-no-files-found: error

      - name: Cleanup Apple signing keychain
        if: always() && runner.os == 'macOS' && steps.macos_signing_config.outputs.signing_enabled == 'true'
        shell: bash
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: DEVX Server ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
